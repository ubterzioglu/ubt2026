name: Project Air senkronizasyonu

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: projectair-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Drive'dan ana planı çek
        run: npm run sync:projectair

      - name: Değişiklik varsa PR aç
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/projectair-sync
          delete-branch: true
          add-paths: content/projectair-plan.ts
          commit-message: "chore(projectair): ana planı Drive'dan güncelle"
          title: "Project Air ana planı Drive'dan güncellendi"
          body: |
            `09_E2E_Kararlar.html` dosyasındaki `#tam-plan .full-document` bölümü değişti; `content/projectair-plan.ts` yeniden üretildi.

            Birleştirince Coolify yeni sürümü yayınlar.
